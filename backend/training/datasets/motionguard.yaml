# YOLO dataset config for MotionGuard custom training.
#
# Expected folder layout:
# backend/training/data/motionguard/
#   images/
#     train/
#     val/
#     test/        # optional
#   labels/
#     train/
#     val/
#     test/        # optional
#
# Labels must use YOLO format:
# class_id x_center y_center width height
# with coordinates normalized from 0 to 1.

path: data/motionguard
train: images/train
val: images/val
test: images/test

names:
  0: person
  1: car
  2: truck
  3: bus
  4: motorcycle
  5: bicycle
  6: backpack
  7: handbag
  8: suitcase
